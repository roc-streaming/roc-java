name: "build"

on:
  push:
    branches:
      - main

  pull_request:

  repository_dispatch:
    types:
      - trigger_build

  workflow_dispatch:
  workflow_call:

  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # build natively on desktop
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest tested JDK
          - os: linux
            image: ubuntu-latest
            jdk: 21
            jacoco: yes

          - os: osx
            image: macos-latest
            jdk: 21
            jacoco: no

          # oldest supported JDK
          - os: linux
            image: ubuntu-latest
            jdk: 17
            jacoco: no

          - os: osx
            image: macos-latest
            jdk: 17
            jacoco: no

    name: desktop/${{ matrix.os }}-jdk${{ matrix.jdk }}
    runs-on: ${{ matrix.image }}

    env:
      ROC_REVISION: master

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.jdk }}
          distribution: temurin

      - name: Install system dependencies
        run: scripts/${{ matrix.os }}/install_dependencies.sh

      - name: Install Roc
        run: scripts/${{ matrix.os }}/build_roc.sh

      - name: Build and test bindings
        run: scripts/${{ matrix.os }}/build_bindings.sh

      - name: Upload test coverage
        if: ${{ github.repository_owner == 'roc-streaming' && matrix.jacoco == 'yes' }}
        id: jacoco
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml

  # build for Android on Linux (with Docker)
  android-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest tested JDK, SDK, and NDK
          - jdk: 21
            sdk: 34
            api: 29
            ndk-major: 26d
            ndk: 26.3.11579264

          # oldest supported JDK, SDK, and NDK
          - jdk: 17
            sdk: 31
            api: 29
            ndk-major: 21e
            ndk: 21.4.7075529

    name: android/linux-jdk${{ matrix.jdk }}-sdk${{ matrix.sdk }}-ndk${{ matrix.ndk-major }}
    runs-on: ubuntu-24.04

    env:
      ROC_REVISION: master
      JAVA_VERSION: ${{ matrix.jdk }}
      SDK_LEVEL: ${{ matrix.sdk }}
      API_LEVEL: ${{ matrix.api }}
      NDK_VERSION: ${{ matrix.ndk }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: scripts/android_docker.sh build

  # build for Android on macOS
  android-osx:
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest tested JDK, SDK, and NDK
          - jdk: 21
            sdk: 34
            api: 29
            ndk-major: 26d
            ndk: 26.3.11579264
            cmdline_tools: 10406996
            build_tools: 35.0.0
            cmake: 3.18.1
            avd_image: default
            avd_arch: x86_64

          # oldest tested JDK, SDK, and NDK
          - jdk: 17
            sdk: 31
            api: 29
            ndk-major: 25
            ndk: 25.2.9519653
            cmdline_tools: 10406996
            build_tools: 30.0.3
            cmake: 3.22.1
            avd_image: default
            avd_arch: x86_64

    name: android/osx-jdk${{ matrix.jdk }}-sdk${{ matrix.sdk }}-ndk${{ matrix.ndk-major }}
    runs-on: macos-15-intel

    env:
      ROC_REVISION: master
      SDK_LEVEL: ${{ matrix.sdk }}
      API_LEVEL: ${{ matrix.api }}
      NDK_VERSION: ${{ matrix.ndk }}
      BUILD_TOOLS_VERSION: ${{ matrix.build_tools }}
      CMAKE_VERSION: ${{ matrix.cmake }}
      AVD_IMAGE: ${{ matrix.avd_image }}
      AVD_ARCH: ${{ matrix.avd_arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.jdk }}
          distribution: temurin

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: ${{ matrix.cmdline_tools }}

      - name: Install Android packages
        run: |
          sdkmanager \
            "platforms;android-${{ matrix.sdk }}" \
            "build-tools;${{ matrix.build_tools }}" \
            "ndk;${{ matrix.ndk }}" \
            "cmake;${{ matrix.cmake }}" \
            "system-images;android-${{ matrix.sdk }};${{ matrix.avd_image }};${{ matrix.avd_arch }}" \
            "emulator"

      - name: Install system dependencies
        run: scripts/android/install_dependencies.sh

      - name: Build Roc
        run: scripts/android/build_roc.sh

      - name: Build bindings
        run: scripts/android/build_bindings.sh

      - name: Run Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.avd_arch }}
          target: ${{ matrix.avd_image }}
          avd-name: roc_device
          ndk: ${{ matrix.ndk }}
          cmake: ${{ matrix.cmake }}
          script: ./scripts/android/run_instrumented_tests.sh
